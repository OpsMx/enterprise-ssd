apiVersion: v1
kind: ConfigMap
metadata:
  name: ssd-shield-gateway-config
  labels:
    app: ssd
{{ include "ssd.standard-labels" . | indent 4 }}
    component: ssd-shield-gateway
data:
{{- /* One key per setting: the Deployment loads this ConfigMap with envFrom. */}}
{{- range $key, $value := (tpl (.Files.Get "config/shield-gateway/config") . | fromYaml) }}
  {{ $key }}: {{ $value | toString | quote }}
{{- end }}
