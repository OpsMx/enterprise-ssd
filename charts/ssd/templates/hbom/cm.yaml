apiVersion: v1
kind: ConfigMap
metadata:
  name: hbom-generator-config
  labels:
    app: ssd
{{ include "ssd.standard-labels" . | indent 4 }}
    component: hbom
data:
{{- /* One key per setting: the Deployment loads this ConfigMap with envFrom. */}}
{{- range $key, $value := (tpl (.Files.Get "config/hbom/config.yaml") . | fromYaml) }}
  {{ $key }}: {{ $value | toString | quote }}
{{- end }}
