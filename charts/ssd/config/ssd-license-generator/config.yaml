server:
  host: "0.0.0.0"             # Server bind address
  port: 8080                   # HTTP port
  read_timeout: 10s            # Maximum duration for reading the entire request
  write_timeout: 10s           # Maximum duration before timing out writes of the response
  idle_timeout: 120s           # Maximum amount of time to wait for the next request
database:
  path: "/app/data/badger"     # BadgerDB database directory path
  # Note: BadgerDB is an embedded key-value store (no connection pooling needed)
cache:
  central_repo_url: "http://35.255.7.45:9000/fetch"  # Central license server URL
  license_dir: "/app/data/licenses"                   # Directory for cached license files
  template_dir: "/app/templates"                      # Directory for template files
  max_age: 24h                                        # Maximum age before license is considered stale
  http_timeout: 30s                                   # Timeout for HTTP requests to central server
logging:
  level: "info"                # Log level: debug, info, warn, error
  format: "json"               # Log format: json, console (use console for development)

consolidation:
  # Disabled by default: every component carries its own license text.
  # To opt in, list the SPDX IDs (case-insensitive) whose identical texts should be rendered once.
  # Only fixed-text licenses that require "a copy of this License" belong here. MIT/BSD/ISC embed
  # per-project copyright notices and must stay per component. Recommended list:
  license_types: []
  # license_types:
  #   - Apache-2.0
  #   - MPL-2.0
  #   - EPL-2.0
  #   - GPL-2.0
  #   - GPL-2.0-only
  #   - GPL-2.0-or-later
  #   - GPL-3.0
  #   - GPL-3.0-only
  #   - GPL-3.0-or-later
